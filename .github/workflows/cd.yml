# Continuous build/test workflow
#
# Runs lint, TypeScript checks, tests, and a production build on pushes and PRs.
# No deployment step: no AWS, no Telegram, no GitHub Pages.
name: Continuous Deployment

on:
  push:
  pull_request:
    types: [opened, reopened]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install

      - name: Lint
        run: pnpm lint

      - name: Check TypeScript
        run: pnpm check:ts

      - name: Test
        run: pnpm test

      - name: Compute branch + build id
        id: ids
        run: |
          RAW="${{ github.head_ref || github.ref_name }}"
          BRANCH=$(echo "$RAW" | sed 's/[^a-zA-Z0-9-]/_/g')
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "build_id=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build app
        env:
          DEPLOY_BRANCH: ${{ steps.ids.outputs.branch }}
          DEPLOY_BUILD_ID: ${{ steps.ids.outputs.build_id }}
          PATTERN_SESSION_KEY: ${{ secrets.SESSION_KEY }}
          PATTERN_RECORD_KEY: ${{ secrets.RECORD_KEY }}
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-stats.html
          path: ./standalone/dist/client/stats.html

      - name: Summary
        env:
          BRANCH: ${{ steps.ids.outputs.branch }}
          BUILD_ID: ${{ steps.ids.outputs.build_id }}
        run: |
          echo "Build succeeded for branch **$BRANCH**" >> "$GITHUB_STEP_SUMMARY"
          echo "Build ID: \`$BUILD_ID\`" >> "$GITHUB_STEP_SUMMARY"
